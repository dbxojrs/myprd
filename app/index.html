<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>반도체 공정 튜터</title>
    <meta name="description" content="배우고, 조건을 바꿔 보고, 현장 사건처럼 풀어 보는 반도체 공정 학습 웹앱" />
    <script>
      // 저장한 테마를 그리기 전에 적용해, 로딩 화면부터 밝기가 맞게 보입니다.
      try {
        var t = localStorage.getItem('tutor.ui.theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f6f7f9; color: #1c2330; font-family: system-ui, sans-serif; }
      .boot-in { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .boot-logo { width: 52px; height: 52px; border-radius: 14px; background: #4f46e5; display: grid; place-items: center; }
      .boot-logo::after { content: ''; width: 18px; height: 18px; background: #fff; transform: rotate(45deg); border-radius: 2px; }
      .boot b { font-size: 18px; }
      .boot small { color: #5d6675; font-size: 13px; }
      .boot-bar { width: 140px; height: 3px; border-radius: 3px; background: rgb(127 127 127 / 0.2); overflow: hidden; }
      .boot-bar::after { content: ''; display: block; width: 40%; height: 100%; background: #4f46e5; animation: boot 1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .boot { background: #12151b; color: #e6e9ef; } :root:not([data-theme='light']) .boot small { color: #9aa3b2; } }
      :root[data-theme='dark'] .boot { background: #12151b; color: #e6e9ef; }
      :root[data-theme='dark'] .boot small { color: #9aa3b2; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="불러오는 중">
        <div class="boot-in">
          <div class="boot-logo"></div>
          <b>반도체 공정 튜터</b>
          <div class="boot-bar"></div>
          <small>학습 화면을 불러오는 중…</small>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
