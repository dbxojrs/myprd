<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 120 80" class="il" role="img" aria-label="공정 개념도"><style>svg {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --text: #1c2330;
  --muted: #5d6675;
  --border: #d8dde5;
  --accent: #2f5bd3;
  --accent-text: #ffffff;
  --accent-soft: #e6ecfb;
  --good: #1f7a45;
  --good-soft: #e3f3ea;
  --warn: #8a5a00;
  --warn-soft: #fbf0d9;
  --bad: #b3261e;
  --bad-soft: #fbe5e3;
  color-scheme: light;
}
svg { background: #ffffff; font-family: sans-serif; }
.il-wafer { fill: var(--muted); }
.il-tape { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 0.8; }
.il-oxide { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 0.6; }
.il-resist { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 0.6; }
.il-tool { fill: var(--border); stroke: var(--text); stroke-width: 1; }
.il-frame { fill: var(--muted); }
.il-substrate { fill: var(--good-soft); stroke: var(--good); stroke-width: 1; }
.il-rdl { fill: var(--accent); }
.il-glue { fill: var(--warn-soft); stroke: var(--warn); stroke-width: 0.8; }
.il-die { fill: var(--surface); stroke: var(--text); stroke-width: 1.5; }
.il-mold { fill: var(--border); stroke: var(--muted); stroke-width: 1; }
.il-wire { fill: none; stroke: var(--warn); stroke-width: 1.5; }
.il-bump { fill: var(--muted); stroke: var(--text); stroke-width: 0.6; }
.il-ghost { opacity: 0.45; }
.il-line { fill: none; stroke: var(--text); stroke-width: 1; }
.il-cut { stroke: var(--bg); stroke-width: 1.5; }
.il-blade { stroke: var(--bad); stroke-width: 2; }
.il-laser { stroke: var(--bad); stroke-width: 2; stroke-dasharray: 3 2; }
.il-probe { stroke: var(--text); stroke-width: 1.5; }
.il-needle { stroke: var(--text); stroke-width: 3; stroke-linecap: round; }
.il-check { fill: none; stroke: var(--good); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.il-arrow line { stroke: var(--accent); stroke-width: 1.5; }
.il-arrow polygon { fill: var(--accent); }
.il-label {
  font-size: 7px;
  fill: var(--muted);
}
.il-mark {
  font-size: 9px;
  font-weight: 700;
  fill: var(--surface);
  letter-spacing: 1px;
}
.il-logic { fill: var(--accent-soft); }
.il-interposer { opacity: 0.85; }
.il-tsv { stroke: var(--warn); stroke-width: 1.5; }
.il-cu { fill: var(--warn); }
.il-link { fill: none; stroke: var(--accent); stroke-width: 2; }
.il-dashed { stroke-dasharray: 3 2; }
.il-tag {
  font-size: 7px;
  font-weight: 700;
  fill: var(--text);
}
.il-blade-spokes line { stroke: var(--text); stroke-width: 1; }
.il-blade-edge { fill: none; stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 2 2; }
.il-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.il-wrap .il {
  margin-bottom: 4px;
}
.il-play {
  font-size: 0.8rem;
  padding: 2px 10px;
}
.il-wide { max-width: 560px; width: 100%; }
.il-kerf { fill: var(--bad); opacity: 0.25; }
.il-cut-top { stroke: var(--bg); stroke-width: 2; }
.il-street { stroke: var(--surface); stroke-width: 0.6; stroke-dasharray: 2 2; opacity: 0.8; }
.il-blade-top { fill: var(--bad); }
.il-divider { stroke: var(--border); stroke-width: 0.8; stroke-dasharray: 3 3; }
.il-cut-dark { stroke: var(--text); }
.il-teeth { stroke: var(--text); stroke-width: 4; stroke-dasharray: 3 3; }
.il-ball { fill: var(--warn); }
.il-cured { fill: var(--good-soft); stroke: var(--good); stroke-width: 0.8; }
.il-signal { fill: var(--accent); }
.il-step { fill: var(--accent); font-weight: 700; }
.il-detail { max-width: 460px; width: 100%; }
.il-diamond { fill: var(--accent); }
.il-hole { fill: var(--surface); stroke: var(--text); stroke-width: 0.8; }
.il-callout { stroke: var(--muted); stroke-width: 0.6; stroke-dasharray: 2 2; }
.il-callout-ring { fill: none; stroke: var(--muted); stroke-width: 0.8; }
.il-zoom { fill: var(--surface); stroke: var(--muted); stroke-width: 0.8; }
.il-bond { fill: var(--border); }
.il-worn { fill: none; stroke: var(--bad); stroke-width: 0.8; stroke-dasharray: 2 1.5; }
.il-dim { stroke: var(--accent); stroke-width: 0.8; }</style><rect x="14" y="20" width="92" height="32" rx="4" class="il-mold"></rect><rect x="44" y="40" width="32" height="10" class="il-die il-ghost"></rect><path d="M48 40 Q34 24 22 52" class="il-wire il-ghost"></path><path d="M72 40 Q86 24 98 52" class="il-wire il-ghost"></path><rect x="14" y="52" width="92" height="6" class="il-frame"></rect><g class="il-arrow"><line x1="60" y1="6" x2="60" y2="18"></line><polygon points="60,18 57.60287230697899,13.612087190548138 62.39712769302101,13.612087190548136"></polygon></g><text x="60" y="72" class="il-label" text-anchor="middle">수지로 다이와 와이어를 감쌈</text></svg>